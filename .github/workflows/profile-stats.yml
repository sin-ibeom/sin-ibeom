name: Update profile stats

on:
  push:
    branches: [main]
    paths-ignore:
      - 'profile/**'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate activity and rank card
        uses: stats-organization/github-readme-stats-action@e52ecffb9b500c9f8532aff89937973d64706446 # v2
        with:
          card: stats
          options: username=sin-ibeom&show_icons=true&disable_animations=true&bg_color=0d1117&title_color=93c5fd&text_color=c9d1d9&icon_color=60a5fa&border_color=30363d
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@e52ecffb9b500c9f8532aff89937973d64706446 # v2
        with:
          card: top-langs
          options: username=sin-ibeom&layout=compact&langs_count=6&disable_animations=true&bg_color=0d1117&title_color=93c5fd&text_color=c9d1d9&border_color=30363d
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Refresh image URLs only when card content changes
        run: python3 .github/scripts/update-card-links.py
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg README.md
          if git diff --cached --quiet; then
            echo 'Stats are unchanged.'
            exit 0
          fi
          git commit -m 'docs: refresh profile stats [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
